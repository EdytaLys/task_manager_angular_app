<form (ngSubmit)="onSubmit()" class="task-form">
  <div class="form-group">
    <label for="title">
      Title *
      <span [class.over-limit]="title.length > 100" class="character-count">
        {{ title.length }}/100 characters
      </span>
    </label>
    <input
      type="text"
      id="title"
      [value]="title"
      (input)="onTitleChange($any($event.target).value)"
      (blur)="onBlur('title')"
      placeholder="Enter task title"
      [class.error]="errors.title && touched['title']"
    />
    <span *ngIf="errors.title && touched['title']" class="error-message">{{ errors.title }}</span>
  </div>

  <div class="form-group">
    <label for="description">
      Description
      <span [class.over-limit]="description.length > 500" class="character-count">
        {{ description.length }}/500 characters
      </span>
    </label>
    <textarea
      id="description"
      [value]="description"
      (input)="onDescriptionChange($any($event.target).value)"
      (blur)="onBlur('description')"
      placeholder="Enter task description"
      rows="3"
      [class.error]="errors.description"
    ></textarea>
    <span *ngIf="errors.description" class="error-message">{{ errors.description }}</span>
  </div>

  <div class="form-group">
    <label for="status">Status *</label>
    <select
      id="status"
      [(ngModel)]="status"
      name="status"
      (blur)="onBlur('status')"
      [class.error]="errors.status && touched['status']"
    >
      <option value="TODO">To Do</option>
      <option value="IN_PROGRESS">In Progress</option>
      <option value="DONE">Done</option>
    </select>
    <span *ngIf="errors.status && touched['status']" class="error-message">{{ errors.status }}</span>
  </div>

  <div class="form-group">
    <label for="dueDate">Due Date</label>
    <input
      type="date"
      id="dueDate"
      [(ngModel)]="dueDate"
      name="dueDate"
      [min]="todayStr"
    />
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">
      {{ initialTask ? 'Update Task' : 'Create Task' }}
    </button>
    <button type="button" (click)="onCancel()" class="btn btn-secondary">Cancel</button>
  </div>
</form>
